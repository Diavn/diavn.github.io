name: Physics V5.1–V5.9 and V6.6 illustrated PDF review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/physics-pdf-review-v61.yml'
      - '.github/scripts/physics_pdf_review_v61.py'
      - 'truongchuyen/physics/physics-math-level1-v51.html'
      - 'truongchuyen/physics/physics-mechanics-level1-v52.html'
      - 'truongchuyen/physics/physics-math-level2-v53.html'
      - 'truongchuyen/physics/physics-volume01-v61.html'
      - 'truongchuyen/physics/physics-mechanics-level2-v54.html'
      - 'truongchuyen/physics/physics-volume02-v62.html'
      - 'truongchuyen/physics/physics-volume03-v62.html'
      - 'truongchuyen/physics/physics-thermal-level2-v55.html'
      - 'truongchuyen/physics/physics-volume04-v63.html'
      - 'truongchuyen/physics/physics-electromagnetism-v56.html'
      - 'truongchuyen/physics/physics-volume05-v63.html'
      - 'truongchuyen/physics/physics-volume06-v63.html'
      - 'truongchuyen/physics/physics-waves-optics-v57.html'
      - 'truongchuyen/physics/physics-volume07-v64.html'
      - 'truongchuyen/physics/physics-volume08-v64.html'
      - 'truongchuyen/physics/physics-modern-experimental-v58.html'
      - 'truongchuyen/physics/physics-volume09-v65.html'
      - 'truongchuyen/physics/physics-volume10-v65.html'
      - 'truongchuyen/physics/physics-olympiad-compendium-v59.html'
      - 'truongchuyen/physics/physics-volume11-v66.html'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core latexmk poppler-utils librsvg2-bin
      - name: Build and inspect 112 illustrated PDF candidates
        run: python3 .github/scripts/physics_pdf_review_v61.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-v61-quality-diagnostics
          path: |
            /tmp/vtalent-pdf-review/quality-report.txt
            /tmp/vtalent-pdf-review/*.build.txt
            /tmp/vtalent-pdf-review/*.log
            /tmp/vtalent-pdf-review/*-cover*.png
            /tmp/vtalent-pdf-review/*-sample*.png
          if-no-files-found: warn
      - name: Upload PDF candidates only if checks passed
        uses: actions/upload-artifact@v4
        with:
          name: physics-v66-illustrated-pdf-candidates
          path: |
            /tmp/vtalent-pdf-review/PHY*-V*-vi.pdf
            /tmp/vtalent-pdf-review/PHY*-V*-en.pdf
            /tmp/vtalent-pdf-review/V0*-V62-vi.pdf
            /tmp/vtalent-pdf-review/V0*-V62-en.pdf
            /tmp/vtalent-pdf-review/V0*-V63-vi.pdf
            /tmp/vtalent-pdf-review/V0*-V63-en.pdf
            /tmp/vtalent-pdf-review/V0*-V64-vi.pdf
            /tmp/vtalent-pdf-review/V0*-V64-en.pdf
            /tmp/vtalent-pdf-review/V*-V65-vi.pdf
            /tmp/vtalent-pdf-review/V*-V65-en.pdf
            /tmp/vtalent-pdf-review/V11-V66-vi.pdf
            /tmp/vtalent-pdf-review/V11-V66-en.pdf
          if-no-files-found: error
