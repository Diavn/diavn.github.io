name: Physics V5.1 V5.2 V5.3 and Volume 1 PDF review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/physics-pdf-review-v61.yml'
      - '.github/scripts/physics_pdf_review_v61.py'
      - 'truongchuyen/physics-math-level1-v51.html'
      - 'truongchuyen/physics-mechanics-level1-v52.html'
      - 'truongchuyen/physics-math-level2-v53.html'
      - 'truongchuyen/physics-volume01-v61.html'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core latexmk poppler-utils
      - name: Build and inspect 20 PDF candidates
        run: python3 .github/scripts/physics_pdf_review_v61.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-v61-quality-diagnostics
          path: |
            /tmp/vtalent-pdf-review/quality-report.txt
            /tmp/vtalent-pdf-review/*.build.txt
            /tmp/vtalent-pdf-review/*-cover*.png
            /tmp/vtalent-pdf-review/*-sample*.png
          if-no-files-found: warn
      - name: Upload PDF candidates only if checks passed
        uses: actions/upload-artifact@v4
        with:
          name: physics-v51-v52-v53-volume01-pdf-candidates
          path: /tmp/vtalent-pdf-review/*.pdf
          if-no-files-found: error
