name: Publish compiled physics draft PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/physics-pdf-release.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: physics-draft-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: physics-textbooks-pdf-candidates
          run-id: 46128800957
          github-token: ${{ github.token }}
          path: /tmp/physics-verified/old
      - uses: actions/download-artifact@v4
        with:
          name: mechanics-pdf-candidates
          run-id: 46128764262
          github-token: ${{ github.token }}
          path: /tmp/physics-verified/mechanics
      - uses: actions/download-artifact@v4
        with:
          name: energy-fluids-pdf-candidates
          run-id: 46129657215
          github-token: ${{ github.token }}
          path: /tmp/physics-verified/energy
      - name: Validate compiled files and generate PDF-only catalogue
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 - <<'PY'
          import pathlib, subprocess, unicodedata, shutil, html
          root=pathlib.Path('/tmp/physics-verified')
          dst=pathlib.Path('truongchuyen/physics-pdfs')
          dst.mkdir(exist_ok=True)
          titles={
            'PHY101-A':('Đơn vị, quy mô và đại số','Units, Scaling and Algebra'),
            'PHY101-B':('Hình học, lượng giác và đồ thị','Geometry, Trigonometry and Graphs'),
            'PHY102-A':('Chuyển động và vận tốc tương đối','Motion and Relative Velocity'),
            'PHY201-A':('Vector, giải tích và xấp xỉ','Vectors, Calculus and Approximation'),
            'PHY201-B':('Phương trình vi phân và số phức','Differential Equations and Complex Numbers'),
            'PHY202-A':('Động lực học Newton','Newtonian Dynamics'),
            'PHY202-B':('Động lượng và va chạm','Momentum and Collisions'),
            'PHY202-D':('Chuyển động quay vật rắn','Rigid-body Rotation'),
            'ENG-MAT01':('Cơ sở cơ học vật liệu','Foundations of Mechanics of Materials'),
            'PHY202-C':('Công, năng lượng và ổn định','Work, Energy and Stability'),
            'PHY202-E':('Hấp dẫn và cơ học quỹ đạo','Gravitation and Orbital Mechanics'),
            'PHY202-F':('Chất lưu và ổn định vật nổi','Fluid Mechanics and Floating Stability'),
            'ENG-MAT02':('Uốn dầm và năng lượng biến dạng','Beam Bending and Strain Energy')}
          pdfs=list(root.rglob('*.pdf'))
          expected={code+'-'+lang+'.pdf' for code in titles for lang in ('vi','en')}
          assert len(pdfs)==26 and {p.name for p in pdfs}==expected
          pages={}
          for p in pdfs:
              info=subprocess.check_output(['pdfinfo',str(p)],text=True)
              count=int(next(s.split(':',1)[1].strip() for s in info.splitlines() if s.startswith('Pages:')))
              assert count>=3
              text=' '.join(unicodedata.normalize('NFC',subprocess.check_output(['pdftotext',str(p),'-'],text=True)).split())
              author='TS. Đặng Minh Tuấn' if p.stem.endswith('-vi') else 'Dr. Dang Minh Tuan'
              assert author in text,p.name
              # Rendering is an automated structural check, not human visual review.
              subprocess.run(['pdftoppm','-f','1','-l','1','-r','60','-png',str(p),'/tmp/physics-preview'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              shutil.copy2(p,dst/p.name)
              pages[p.name]=count
              print(p.name,count,'pages',author)
          rows=''
          for code,(vi,en) in titles.items():
              rows+=f'<tr><td>{code}</td><td><span lang="vi">{html.escape(vi)}</span><span lang="en">{html.escape(en)}</span></td>'
              for lang,author in [('vi','TS. Đặng Minh Tuấn'),('en','Dr. Dang Minh Tuan')]:
                  name=code+'-'+lang+'.pdf'
                  rows+=f'<td><a href="./physics-pdfs/{name}">PDF {lang.upper()} · {pages[name]} p.</a><br><small>{author}</small></td>'
              rows+='</tr>'
          page='''<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics PDF Library | V-TALENT 2045</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>[hidden]{display:none!important}.toolbar{display:flex;gap:12px;flex-wrap:wrap}.tablewrap{overflow:auto}td{vertical-align:top}span[lang="en"]{display:block;color:inherit;opacity:.8}</style></head><body class="physics-page"><main><section class="hero"><div class="wrap"><div class="eyebrow">V-TALENT 2045 · PDF LIBRARY</div><h1>Giáo trình Vật lý / Physics Textbooks</h1><p>13 chuyên đề · 26 bản PDF EN/VIE đã biên dịch. Bản đọc thử, chưa thẩm định độc lập và chưa rà soát trực quan toàn bộ trang.</p><p>13 study units · 26 compiled PDF editions. Review drafts; independent academic and complete visual review pending.</p><div class="toolbar"><a class="btn btn-primary" href="./physics-textbooks.html">Textbook catalogue</a><a class="btn btn-ghost" href="./physics-curriculum.html">Curriculum</a></div></div></section><section class="section"><div class="wrap"><div class="tablewrap"><table><thead><tr><th>Code</th><th>Chuyên đề / Topic</th><th>Tiếng Việt</th><th>English</th></tr></thead><tbody>'''+rows+'''</tbody></table></div><p>Chỉ công bố PDF, không có nút tải TEX/JSON. PDF-only downloads.</p></div></section></main></body></html>'''
          pathlib.Path('truongchuyen/physics-pdf-library.html').write_text(page,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add truongchuyen/physics-pdfs/*.pdf truongchuyen/physics-pdf-library.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish 26 compiled physics review-draft PDFs and PDF-only library"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
