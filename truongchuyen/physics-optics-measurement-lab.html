const $=id=>document.getElementById(id),I={title:["Phòng mô phỏng Sóng–Quang và đo lường","Optics and measurement lab"],author:["TS. Đặng Minh Tuấn","Dr. Dang Minh Tuan"],lens:["Thấu kính hội tụ mỏng","Thin converging lens"],lintro:["Vật thật cao 1 đơn vị; tia qua quang tâm và tia song song trục. Gần tiêu điểm ảnh có thể vượt miền vẽ; đọc giá trị v bên dưới. Đường nét đứt là phần kéo dài, không phải tia truyền thật.","Real object height one unit; central and parallel rays. Near focus the image can leave the plot; read v below. Dashed lines are extensions, not physical rays."],ltask:["Dự đoán ảnh khi u/f đi qua 1. So sánh u/f=0.5 và 1.5. Giải thích vì sao dấu của m cho biết chiều ảnh.","Predict image as u/f passes 1. Compare u/f=0.5 and 1.5. Explain how sign of m gives orientation."],slit:["Hai khe hữu hạn: giao thoa và nhiễu xạ","Finite double slit: interference and diffraction"],sintro:["Hai khe đều rộng a, cách tâm d. Màn D=1 m, góc nhỏ. Đồ thị I/Imax và bao khe đơn. Xét nguồn đơn sắc kết hợp, không nhiễu nền.","Equal slit width a, center separation d. Screen D=1 m, small-angle approximation. Plot I/Imax and single-slit envelope. Monochromatic coherent source, no background."],stask:["Đặt d/a=5. Giải thích tại sao bậc sáng ±5 biến mất. Đổi bước sóng: khoảng vân và bao thay đổi thế nào?","Set d/a=5. Explain why bright orders ±5 disappear. Change wavelength: how do spacing and envelope change?"],fit:["Hồi quy và phần dư","Regression and residuals"],fintro:["Số liệu mô phỏng y=2x+b+qx²+ε trên x=0…5. Mẫu ε cố định, thay đổi biên độ bằng thanh trượt; không phải dữ liệu thực nghiệm. Hồi quy tuyến tính có hệ số chặn.","Simulated y=2x+b+qx²+ε at x=0…5. Fixed noise pattern scaled by slider; not observed data. Linear regression includes intercept."],curve:["Hệ số cong q","Curvature q"],bias:["Độ lệch b","Offset b"],noise:["Biên độ nhiễu","Noise scale"],ftask:["Thử q=0, b=0 rồi b=2. So sánh hệ số dốc và phần dư. Tăng q và xem R² vẫn có thể cao dù phần dư có cấu trúc. Nêu phép đo giúp phân biệt hai mô hình.","Try q=0, b=0 then b=2. Compare slope and residuals. Increase q and see that R² can remain high despite structured residuals. Propose measurements to distinguish models."],limits:["Mô hình giải tích 2D và dữ liệu tổng hợp phục vụ học tập; không thay thế kiểm định thiết bị quang học hay thực nghiệm thật.","Analytical 2D models and synthetic data for learning; not substitutes for optical-device validation or real experiments."]};
let lang=new URLSearchParams(location.search).get("lang");if(!["vi","en"].includes(lang)){try{lang=localStorage.getItem("vt-physics-lang")}catch{}if(!["vi","en"].includes(lang))lang="vi"}const L=(a,b)=>lang==="vi"?a:b;function val(id,out,d=0){let v=+$(id).value;$(out).textContent=v.toFixed(d);return v}
function lens(){let f=val("f","fo"),r=val("ratio","uo",2),u=f*r,focus=Math.abs(r-1)<1e-9,v=focus?Infinity:f*r/(r-1),m=focus?null:-1/(r-1),scale=62,X=x=>330+scale*x,Y=y=>166-35*y;let vN=focus?Infinity:v/f,clip=4.8,visible=Number.isFinite(vN)&&Math.abs(vN)<=clip&&Math.abs(m)<=4.2;
let s='<defs><clipPath id="lensclip"><rect x="15" y="15" width="650" height="305"/></clipPath></defs><g clip-path="url(#lensclip)"><path d="M15 166H665" stroke="#738b88" stroke-dasharray="4 4"/><path d="M330 30 Q307 166 330 302 Q353 166 330 30Z" fill="#c0d8d7" stroke="#397c79" stroke-width="2"/><circle cx="'+X(-1)+'" cy="166" r="3" fill="#34595c"/><circle cx="'+X(1)+'" cy="166" r="3" fill="#34595c"/><text x="'+X(-1)+'" y="184">F</text><text x="'+X(1)+'" y="184">F</text>';
function arrow(x,y,col,dash=false){let bx=X(x),by=Y(y);return '<path d="M'+bx+' 166V'+by+' l-5 '+(y>0?8:-8)+' m5 '+(y>0?-8:8)+' l5 '+(y>0?8:-8)+'" fill="none" stroke="'+col+'" stroke-width="2.5" '+(dash?'stroke-dasharray="4 3"':'')+'/>'}
let xe=4.9;s+=arrow(-r,1,"#397c79")+'<path d="M'+X(-r)+' '+Y(1)+' L330 '+Y(1)+' L'+X(xe)+' '+Y(1-xe)+'" fill="none" stroke="#b68742" stroke-width="2"/><path d="M'+X(-r)+' '+Y(1)+' L330 166 L'+X(xe)+' '+Y(-xe/r)+'" fill="none" stroke="#547f9d" stroke-width="2"/>';if(visible){if(v<0)s+='<path d="M330 '+Y(1)+' L'+X(vN)+' '+Y(m)+' M330 166 L'+X(vN)+' '+Y(m)+'" fill="none" stroke="#547f9d" stroke-dasharray="4 3"/>';s+=arrow(vN,m,"#34595c",v<0)}s+='</g><text x="12" y="331">'+L("Đơn vị ngang: f","Horizontal units: f")+'</text><text x="'+X(-r)+'" y="154" text-anchor="middle">'+L("Vật","Object")+'</text>';$("lg").innerHTML=s;$("lr").textContent=focus?L("u=f: tia ra song song, không có ảnh hữu hạn.","u=f: emerging rays parallel, no finite image."):"u = "+u.toFixed(2)+" cm · v = "+v.toFixed(2)+" cm · m = "+m.toFixed(3)+" · "+(v>0?L("ảnh thật, ngược chiều","real, inverted"):L("ảnh ảo, cùng chiều","virtual, upright"))+(!visible?L(" · ảnh ngoài miền vẽ"," · image outside plot"):"")}
function slits(){let w=val("wave","wo")*1e-9,a=val("a","ao",2)*1e-3,r=val("da","dao",1),d=a*r;let X=y=>340+y/15*295,Y=z=>250-205*z,env=y=>{let b=Math.PI*a*y*.001/w;return Math.abs(b)<1e-12?1:(Math.sin(b)/b)**2},int=y=>env(y)*Math.cos(Math.PI*d*y*.001/w)**2;let s='<path d="M45 40V250H635" stroke="#34595c" fill="none" stroke-width="2"/>';for(let j of [0,.25,.5,.75,1])s+='<line x1="45" x2="635" y1="'+Y(j)+'" y2="'+Y(j)+'" stroke="#c5d5d3"/><text x="36" y="'+(Y(j)+4)+'" text-anchor="end">'+j+'</text>';for(let y of [-15,-10,-5,0,5,10,15])s+='<text x="'+X(y)+'" y="270" text-anchor="middle">'+y+'</text>';let pts=Array.from({length:1801},(_,i)=>-15+i/60);s+='<polyline points="'+pts.map(y=>X(y)+','+Y(env(y))).join(' ')+'" fill="none" stroke="#b68742" stroke-width="1.8" stroke-dasharray="4 3"/><polyline points="'+pts.map(y=>X(y)+','+Y(int(y))).join(' ')+'" fill="none" stroke="#397c79" stroke-width="2"/><text x="10" y="20">I/Imax</text><text x="595" y="294">y (mm)</text>';$("sg").innerHTML=s;$("sr").textContent=L("Khoảng vân","Fringe spacing")+" = "+(w/d*1000).toFixed(3)+" mm · "+L("Cực tiểu bao đầu","First envelope minimum")+" = ±"+(w/a*1000).toFixed(3)+" mm · "+L("Bậc mất","Missing orders")+" = "+(Math.abs(r-Math.round(r))<1e-9?"±"+r+", ±"+2*r+", …":"±"+Math.round(r*2)+", ±"+Math.round(r*4)+", …")}
function fit(){let q=val("q","qo",2),b0=val("bias","bo",1),n=val("noise","no",2),eps=[.2,-.7,.9,-.4,.6,-.6],data=eps.map((e,x)=>({x,y:2*x+b0+q*x*x+n*e})),xm=2.5,ym=data.reduce((s,p)=>s+p.y,0)/6,sxx=data.reduce((s,p)=>s+(p.x-xm)**2,0),sxy=data.reduce((s,p)=>s+(p.x-xm)*(p.y-ym),0),slope=sxy/sxx,a=ym-slope*xm;for(let p of data){p.fit=a+slope*p.x;p.e=p.y-p.fit}let sse=data.reduce((s,p)=>s+p.e*p.e,0),sst=data.reduce((s,p)=>s+(p.y-ym)**2,0),r2=sst>0?1-sse/sst:0,ub=Math.sqrt(sse/4/sxx),lo=Math.min(0,...data.flatMap(p=>[p.y,p.fit]))-1,hi=Math.max(...data.flatMap(p=>[p.y,p.fit]))+1,emax=Math.max(.2,...data.map(p=>Math.abs(p.e)))*1.15,X=x=>70+x/5*550,Y=y=>220-(y-lo)/(hi-lo)*180,E=e=>310-e/emax*48;let s='<path d="M70 40V220H620 M70 250V360H620" fill="none" stroke="#34595c"/><line x1="70" x2="620" y1="310" y2="310" stroke="#738b88" stroke-dasharray="3 4"/><text x="12" y="25">y</text><text x="12" y="253">residual</text><text x="12" y="270">±'+emax.toFixed(2)+'</text><path d="M'+X(0)+' '+Y(a)+' L'+X(5)+' '+Y(a+5*slope)+'" stroke="#547f9d" stroke-width="2.2" fill="none"/>';for(let p of data)s+='<line x1="'+X(p.x)+'" x2="'+X(p.x)+'" y1="'+Y(p.y)+'" y2="'+Y(p.fit)+'" stroke="#b68742"/><circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="4" fill="#397c79"/><circle cx="'+X(p.x)+'" cy="'+E(p.e)+'" r="4" fill="#b68742"/><text x="'+X(p.x)+'" y="375" text-anchor="middle">'+p.x+'</text>';$("fg").innerHTML=s;$("data").innerHTML=data.map(p=>'<tr><td>'+p.x+'</td><td>'+p.y.toFixed(3)+'</td><td>'+p.fit.toFixed(3)+'</td><td>'+p.e.toFixed(3)+'</td></tr>').join('');$("fr").textContent="y fit = "+a.toFixed(3)+" + "+slope.toFixed(3)+"x · R² = "+r2.toFixed(4)+" · SSE = "+sse.toFixed(4)+" · u(b) = "+ub.toFixed(4)+" "+L("(giả thiết OLS)","(OLS assumptions)")}
function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(x=>x.textContent=I[x.dataset.i][lang==="vi"?0:1]);for(let k of ["vi","en"]){$(k).className="btn "+(lang===k?"btn-primary":"btn-ghost");$(k).setAttribute("aria-pressed",String(lang===k))}lens();slits();fit()}for(let k of ["vi","en"])$(k).onclick=()=>{lang=k;try{localStorage.setItem("vt-physics-lang",k)}catch{}render()};for(let k of ["f","ratio"])$(k).oninput=lens;for(let k of ["wave","a","da"])$(k).oninput=slits;for(let k of ["q","bias","noise"])$(k).oninput=fit;render();</script></body></html>
