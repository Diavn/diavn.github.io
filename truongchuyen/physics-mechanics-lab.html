<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collision and Materials Lab | V-TALENT 2045</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>[hidden]{display:none!important}.panel{margin:18px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap}label{display:block;margin:10px 0}svg{width:100%;max-width:650px;height:auto;background:#f0f5f4}output{font-weight:bold}</style></head><body class="physics-page"><main><section class="hero"><div class="wrap"><div class="eyebrow">V-TALENT 2045 · MECHANICS LAB</div><h1>Collision &amp; Materials Lab</h1><div class="toolbar"><button id="vi" class="btn btn-primary">Tiếng Việt</button><button id="en" class="btn btn-ghost">English</button><a class="btn btn-ghost" href="./physics-mechanics-series.html">Mechanics series</a></div><p data-i="author"></p></div></section><section class="section"><div class="wrap"><article class="panel"><small>SIM-M01 · PHY202-B</small><h2 data-i="collision"></h2><p data-i="cintro"></p><label>m₁ (kg) <input id="m1" type="range" min="1" max="5" step=".5" value="2"> <output id="m1o"></output></label><label>m₂ (kg) <input id="m2" type="range" min="1" max="5" step=".5" value="3"> <output id="m2o"></output></label><label>u₁ (m/s) <input id="u" type="range" min="1" max="8" step=".5" value="5"> <output id="uo"></output></label><label>e <input id="e" type="range" min="0" max="1" step=".05" value=".5"> <output id="eo"></output></label><svg id="cg" viewBox="0 0 600 275" role="img" aria-label="Before and after collision signed velocity vectors"></svg><p id="cr" role="status"></p><p data-i="ctask"></p></article><article class="panel"><small>SIM-M02 · PHY202-D</small><h2 data-i="wheel"></h2><p data-i="wintro"></p><label>N <input id="n" type="range" min="4" max="16" step="2" value="8"> <output id="no"></output></label><label>β = I/(MR²) <input id="beta" type="range" min=".2" max="1" step=".05" value=".35"> <output id="bo"></output></label><svg id="wg" viewBox="0 0 600 260" role="img" aria-label="Rimless wheel and centre height"></svg><p id="wr" role="status"></p><p data-i="wtask"></p></article><article class="panel"><small>SIM-M03 · ENG-MAT01</small><h2 data-i="beam"></h2><p data-i="bintro"></p><label>E₂/E₁ <input id="ratio" type="range" min=".25" max="8" step=".25" value="3"> <output id="ratioo"></output></label><svg id="bg" viewBox="0 0 600 260" role="img" aria-label="Layered beam neutral axis and stress profile"></svg><p id="br" role="status"></p><p data-i="btask"></p></article><p data-i="limit"></p></div></section></main><script>const $=id=>document.getElementById(id),T={author:["TS. Đặng Minh Tuấn","Dr. Dang Minh Tuan"],collision:["Va chạm một chiều","One-dimensional impact"],cintro:["Vật 2 ban đầu đứng yên; xung lượng ngoài theo trục bằng 0. Mũi tên biểu thị vận tốc có dấu, không phải vị trí theo thời gian.","Body 2 is initially stationary; external impulse along the axis is zero. Arrows represent signed velocities, not trajectories."],ctask:["Giữ khối lượng cố định, thay e từ 1 đến 0. Giải thích vì sao động lượng giữ nguyên nhưng động năng giảm. Dự đoán khi nào vật 1 bật lại.","Keep masses fixed and vary e from 1 to 0. Explain conserved momentum but reduced kinetic energy. Predict when body 1 rebounds."],wheel:["Bánh xe không vành","Rimless wheel"],wintro:["N chân cách đều, hai điểm tựa liên tiếp, dính hoàn toàn tại chân mới. R=0,25 m, g=10 m/s². Giữ β độc lập để khảo sát mô hình; không phải thiết kế hình học cụ thể.","N evenly spaced spokes, successive pivots and perfectly sticking new contact. R=0.25 m, g=10 m/s². Vary β independently as a model parameter, not a specific geometric design."],wtask:["Tăng N ở β cố định, dự đoán tổn thất mỗi lần đổi chân. Kiểm tra giới hạn N tiến tới vô hạn.","Increase N at fixed β; predict energy loss per pivot change. Examine the large-N limit."],beam:["Trục trung hòa và ứng suất dầm hai lớp","Neutral axis and stress in a bilayer beam"],bintro:["Hai lớp cùng b,h; lớp dưới E₁, lớp trên E₂. Uốn thuần với độ cong dương cố định. Trục ngang biểu đồ là σ/(E₁κh), chiều cao là z/h.","Equal layer width and thickness; lower modulus E₁, upper E₂. Pure bending at fixed positive curvature. Horizontal graph axis: σ/(E₁κh); vertical: z/h."],btask:["Thử E₂/E₁=1 và 3. Giải thích biến dạng liên tục nhưng ứng suất có bước nhảy tại mặt phân lớp. Tại sao vị trí trục trung hòa thay đổi?","Compare E₂/E₁=1 and 3. Explain continuous strain but a stress jump at the interface. Why does the neutral axis shift?"],limit:["Mô hình lý tưởng cho học tập; không chứng nhận an toàn va chạm, phương tiện hoặc kết cấu.","Ideal educational models; not impact, vehicle or structural safety certification."]};let lang="vi";try{lang=localStorage.getItem("vt-physics-lang")||"vi"}catch{}if(!["vi","en"].includes(lang))lang="vi";const L=(a,b)=>lang==="vi"?a:b;function val(k,out){let v=+$(k).value;$(out).textContent=v.toFixed(2);return v}function arrow(x,y,v,color){let dx=27*v,ex=x+dx;return '<line x1="'+x+'" y1="'+y+'" x2="'+ex+'" y2="'+y+'" stroke="'+color+'" stroke-width="3"/>'+(Math.abs(dx)>1?'<path d="M'+ex+' '+y+' l'+(-Math.sign(dx)*8)+' -5 v10 Z" fill="'+color+'"/>':'')}function collision(){let m=val("m1","m1o"),M=val("m2","m2o"),u=val("u","uo"),e=val("e","eo"),p=m*u,V=p/(m+M),v1=V-M/(m+M)*e*u,v2=V+m/(m+M)*e*u,k0=.5*m*u*u,k1=.5*m*v1*v1+.5*M*v2*v2,loss=k0-k1,s='<text x="15" y="25">'+L("Trước","Before")+'</text><text x="15" y="153">'+L("Sau","After")+'</text>';for(let [y,a,b] of [[70,u,0],[200,v1,v2]]){s+='<line x1="20" x2="580" y1="'+(y+25)+'" y2="'+(y+25)+'" stroke="#9bb1af"/><circle cx="155" cy="'+y+'" r="'+(14+5*Math.sqrt(m))+'" fill="#397c79"/><circle cx="350" cy="'+y+'" r="'+(14+5*Math.sqrt(M))+'" fill="#b68742"/>'+arrow(155,y-40,a,"#245d5a")+arrow(350,y-40,b,"#986723")+'<text x="155" y="'+(y+45)+'" text-anchor="middle">1: '+a.toFixed(2)+' m/s</text><text x="350" y="'+(y+45)+'" text-anchor="middle">2: '+b.toFixed(2)+' m/s</text>'}$("cg").innerHTML=s;$("cr").textContent="p = "+p.toFixed(2)+" kg m/s · p′ = "+(m*v1+M*v2).toFixed(2)+" kg m/s · "+L("Động năng mất","Energy lost")+" = "+loss.toFixed(2)+" J ("+(100*loss/k0).toFixed(1)+"%)"}function wheel(){let n=val("n","no"),b=val("beta","bo"),a=Math.PI/n,c=(b+Math.cos(2*a))/(1+b),th=Math.sqrt(20*(1-Math.cos(a))/((1+b)*.25)),r=100,cx=250,cy=210-r*Math.cos(a),s='<line x1="40" x2="560" y1="210" y2="210" stroke="#58716e" stroke-width="2"/>';for(let i=0;i<n;i++){let t=Math.PI/2+a+i*2*Math.PI/n,x=cx+r*Math.cos(t),y=cy+r*Math.sin(t);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#397c79" stroke-width="5" stroke-linecap="round"/>'}s+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#b68742"/><line x1="'+cx+'" x2="'+cx+'" y1="'+cy+'" y2="210" stroke="#b68742" stroke-dasharray="4 3"/><text x="'+(cx+12)+'" y="'+(cy+40)+'">R cos α</text><text x="405" y="40">2α = '+(360/n).toFixed(1)+'°</text>';$("wg").innerHTML=s;$("wr").textContent="ω⁺/ω⁻ = "+c.toFixed(4)+" · "+L("Mất động năng","Energy loss")+" = "+(100*(1-c*c)).toFixed(2)+"% · ω_min = "+th.toFixed(3)+" rad/s"}function beam(){let k=val("ratio","ratioo"),z=(.5+1.5*k)/(1+k),D=(1+k)/12+(.5-z)**2+k*(1.5-z)**2,Y=t=>220-90*t,max=Math.max(z,k*(2-z),1),X=s=>410+125*s/max,s='<rect x="65" y="40" width="120" height="90" fill="#bca271"/><rect x="65" y="130" width="120" height="90" fill="#83aaa3"/><text x="125" y="90" text-anchor="middle">E₂</text><text x="125" y="180" text-anchor="middle">E₁</text><line x1="45" x2="560" y1="'+Y(z)+'" y2="'+Y(z)+'" stroke="#344f50" stroke-dasharray="5 4"/><text x="15" y="'+(Y(z)-5)+'">z_N</text><line x1="410" x2="410" y1="25" y2="235" stroke="#344f50"/><line x1="275" x2="550" y1="130" y2="130" stroke="#a7b8b6" stroke-dasharray="3 3"/><polyline points="'+X(z)+','+Y(0)+' '+X(z-1)+','+Y(1)+'" fill="none" stroke="#397c79" stroke-width="3"/><polyline points="'+X(k*(z-1))+','+Y(1)+' '+X(k*(z-2))+','+Y(2)+'" fill="none" stroke="#b68742" stroke-width="3"/><text x="410" y="250" text-anchor="middle">σ/(E₁κh)</text>';$("bg").innerHTML=s;$("br").textContent="z_N/h = "+z.toFixed(4)+" · D/(E₁bh³) = "+D.toFixed(4)+" · ε/hκ = −(z/h − z_N/h)"}function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(x=>x.textContent=T[x.dataset.i][lang==="vi"?0:1]);for(let k of ["vi","en"]){$(k).className="btn "+(k===lang?"btn-primary":"btn-ghost");$(k).setAttribute("aria-pressed",String(k===lang))}collision();wheel();beam()}for(let k of ["vi","en"])$(k).onclick=()=>{lang=k;try{localStorage.setItem("vt-physics-lang",k)}catch{}render()};for(let k of ["m1","m2","u","e"])$(k).oninput=collision;for(let k of ["n","beta"])$(k).oninput=wheel;$("ratio").oninput=beam;render();</script></body></html>
