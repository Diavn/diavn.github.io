<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electricity &amp; semiconductor lab | V-TALENT 2045</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>.panel{margin:20px 0}.toolbar{display:flex;flex-wrap:wrap;gap:12px}label{display:block;margin:10px 0}svg{max-width:680px;width:100%;height:auto;background:#f1f5f4;color:#244e49}output{font-weight:bold}.note{max-width:85ch}</style></head><body class="physics-page"><main><section class="hero"><div class="wrap"><div class="eyebrow">V-TALENT 2045 · ELECTRICITY LAB</div><h1 data-i="title"></h1><div class="toolbar"><button id="vi" class="btn btn-primary">Tiếng Việt</button><button id="en" class="btn btn-ghost">English</button><a href="./physics-electricity-series.html" class="btn btn-ghost">Study series / Giáo trình</a><a href="./physics-curriculum.html" class="btn btn-ghost">Curriculum</a></div><p data-i="author"></p></div></section><section class="section"><div class="wrap"><article class="panel"><small>SIM-E01 · PHY103-B / PHY204-B</small><h2 data-i="divider"></h2><p data-i="divintro"></p><label>R₁ (kΩ) <input id="r1" type="range" min="1" max="20" step="1" value="4"> <output id="r1o"></output></label><label>R₂ (kΩ) <input id="r2" type="range" min="1" max="20" step="1" value="6"> <output id="r2o"></output></label><label>R<sub>L</sub> (kΩ) <input id="rl" type="range" min="1" max="100" step="1" value="10"> <output id="rlo"></output></label><label><input type="checkbox" id="load" checked> <span data-i="connect"></span></label><svg id="dv" viewBox="0 0 600 290" role="img" aria-label="Voltage divider with optional parallel load"></svg><p id="dr" role="status"></p><p data-i="divtask"></p></article><article class="panel"><small>SIM-E02 · PHY204-C / PHY207-B</small><h2 data-i="hall"></h2><p data-i="hallintro"></p><label>B (T) <input id="b" type="range" min="-.5" max=".5" step=".025" value=".1"> <output id="bo"></output></label><label>log₁₀ n (m⁻³) <input id="n" type="range" min="20" max="24" step=".25" value="22"> <output id="no"></output></label><label>I (mA) <input id="i" type="range" min="1" max="10" step="1" value="1"> <output id="io"></output></label><svg id="hv" viewBox="0 0 600 245" role="img" aria-label="Single-carrier Hall sensor and magnetic field orientation"></svg><p id="hr" role="status"></p><p data-i="halltask"></p></article><article class="panel"><small>SIM-E03 · PHY207-B</small><h2 data-i="diode"></h2><p data-i="dintro"></p><label>T (K) <input id="temp" type="range" min="250" max="350" step="5" value="300"> <output id="to"></output></label><label>n<sub>d</sub> <input id="nd" type="range" min="1" max="2" step=".1" value="1"> <output id="ndo"></output></label><label>V (V) <input id="v" type="range" min="0" max=".3" step=".005" value=".18"> <output id="vo"></output></label><svg id="dg" viewBox="0 0 600 300" role="img" aria-label="Logarithmic plot of ideal forward diode current versus voltage"></svg><p id="dor" role="status"></p><p data-i="dtask"></p></article><p class="note" data-i="limits"></p></div></section></main><script>const $=x=>document.getElementById(x),I={title:["Phòng mô phỏng Điện–Từ và bán dẫn","Electricity and semiconductor lab"],author:["TS. Đặng Minh Tuấn","Dr. Dang Minh Tuan"],divider:["Phân áp có tải","Loaded voltage divider"],divintro:["Nguồn lý tưởng 5 V. R₁ nối tiếp R₂; tải RL mắc song song R₂. So sánh điện áp ra khi có tải và không tải.","Ideal 5 V supply. R₁ in series with R₂; RL is parallel to R₂. Compare loaded and unloaded output voltage."],connect:["Nối tải RL","Connect load RL"],divtask:["Giữ R₁ và R₂ cố định, giảm RL. Dự đoán dấu thay đổi điện áp ra và giải thích bằng điện trở tương đương. Khi nào có thể bỏ qua tải đo?","Hold R₁ and R₂ fixed, reduce RL. Predict the direction of output change using equivalent resistance. When is meter loading negligible?"],hall:["Hiệu ứng Hall một loại hạt tải","Single-carrier Hall effect"],hallintro:["Mẫu dày 0,5 mm theo B. Dùng độ lớn điện tích 1,6×10⁻¹⁹ C. Chỉ tính độ lớn điện áp Hall; dấu đo phụ thuộc loại hạt tải và cực đo.","Thickness along B is 0.5 mm. Charge magnitude 1.6×10⁻¹⁹ C. Only Hall voltage magnitude is computed; measured sign depends on carrier type and contact convention."],halltask:["Tăng n gấp 10 lần và giữ I, B. So sánh độ lớn tín hiệu. Vì sao cần biết độ dày mẫu để suy mật độ hạt tải?","Increase n tenfold, keeping I and B fixed. Compare signal magnitude. Why is sample thickness needed to infer carrier density?"],diode:["Đặc tuyến diode Shockley lý tưởng","Ideal Shockley diode characteristic"],dintro:["Giữ Is = 1 nA cố định để khảo sát riêng ảnh hưởng của VT=kBT/q và hệ số lý tưởng. Trong diode thực Is phụ thuộc mạnh vào nhiệt độ. Trục đứng logarit, chỉ biểu diễn V>0.","Hold Is = 1 nA fixed to isolate the effect of VT=kBT/q and ideality factor. Real diode Is depends strongly on temperature. Vertical axis is logarithmic and only V>0 is plotted."],dtask:["Giữ nhiệt độ và n_d. Thử tăng điện áp mỗi 0,06 V. Khi nào dòng gần tăng một bậc độ lớn? Vì sao không ngoại suy mô hình đến dòng rất lớn?","Hold temperature and ideality fixed. Increase voltage by 0.06 V. When does current rise by roughly one decade? Why not extrapolate to very large current?"],limits:["Mô hình giải tích 2D cho học tập. Không phải mô phỏng linh kiện thực, không dùng để xác nhận thiết kế điện công suất hoặc an toàn. Chỉ thực nghiệm với thiết bị điện áp thấp có giám sát.","Analytical 2D learning models, not real-device or power-design validation. Use supervised low-voltage educational equipment only."]};let lang=new URLSearchParams(location.search).get("lang");if(!["vi","en"].includes(lang)){try{lang=localStorage.getItem("vt-physics-lang")}catch{}if(!["vi","en"].includes(lang))lang="vi"}const L=(a,b)=>lang==="vi"?a:b;function val(id,out,n=2){let v=+$(id).value;$(out).textContent=v.toFixed(n);return v}function divider(){let a=val("r1","r1o",0),b=val("r2","r2o",0),c=val("rl","rlo",0),on=$("load").checked,r=on?b*c/(b+c):b,v=5*r/(a+r),u=5*b/(a+b),s='<g stroke="#34595c" stroke-width="2.5" fill="none"><path d="M90 70V240H430 M90 30H250 V55 M250 115V155 M250 215V240 M250 135H430 V155 M430 215V240"/><path d="M75 55H105 M82 65H98 M90 30V55 M90 65V70"/><rect x="228" y="55" width="44" height="60"/><rect x="228" y="155" width="44" height="60"/></g><text x="40" y="58">5 V</text><text x="282" y="88">R₁</text><text x="282" y="188">R₂</text><circle cx="250" cy="135" r="4" fill="#397c79"/><text x="265" y="128">Vout</text>';if(on)s+='<rect x="408" y="155" width="44" height="60" stroke="#b68742" stroke-width="2.5" fill="none"/><text x="465" y="190">RL</text>';else s+='<text x="418" y="188">'+L("Hở","Open")+'</text>';$("dv").innerHTML=s;$("dr").textContent="Vout = "+v.toFixed(3)+" V · "+L("Không tải","Unloaded")+" = "+u.toFixed(3)+" V · "+L("Dòng nguồn","Supply current")+" = "+(5/(a+r)).toFixed(3)+" mA"}function hall(){let b=val("b","bo",3),n=val("n","no",2),i=val("i","io",0),v=Math.abs(i*.001*b/(Math.pow(10,n)*1.6e-19*.0005)),sym=b===0?"0":b>0?"⊗":"⊙";$("hv").innerHTML='<rect x="125" y="50" width="350" height="140" rx="8" fill="#98b9b1" stroke="#34595c"/><path d="M35 120 H115 l-12 -6 m12 6 l-12 6" stroke="#34595c" stroke-width="3" fill="none"/><text x="60" y="106">I</text><path d="M300 50V20 M300 190V220" stroke="#b68742" stroke-width="3"/><text x="315" y="25">VH</text><text x="315" y="225">VH</text>'+[210,300,390].map(x=>'<text x="'+x+'" y="131" text-anchor="middle" font-size="34" fill="#34595c">'+sym+'</text>').join('')+'<text x="490" y="130">B</text>';$("hr").textContent="|VH| = "+(v*1e6).toPrecision(4)+" μV · n = "+Math.pow(10,n).toExponential(3)+" m⁻³"}function diode(){let T=val("temp","to",0),n=val("nd","ndo",1),v=val("v","vo",3),vt=8.617333262e-5*T,cur=x=>1e-9*Math.expm1(x/(n*vt)),X=x=>65+x/.3*500,Y=y=>255-(Math.log10(y)+11)/8*220;let s='<path d="M65 35V255H565" stroke="#34595c" stroke-width="2" fill="none"/>';for(let j=-11;j<=-3;j++){let y=Y(Math.pow(10,j));s+='<line x1="65" x2="565" y1="'+y+'" y2="'+y+'" stroke="#c6d7d4"/><text x="56" y="'+(y+4)+'" text-anchor="end">10^'+j+'</text>'}for(let j=0;j<=3;j++){let x=.1*j;s+='<text x="'+X(x)+'" y="276" text-anchor="middle">'+x.toFixed(1)+'</text>'}let pts=Array.from({length:300},(_,i)=>.001*(i+1)).map(x=>[X(x),Y(cur(x))]).filter(p=>p[1]>=35&&p[1]<=255);s+='<polyline fill="none" stroke="#397c79" stroke-width="3" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';let z=cur(v);if(v>0&&Y(z)>=35&&Y(z)<=255)s+='<circle cx="'+X(v)+'" cy="'+Y(z)+'" r="5" fill="#b68742"/>';$("dg").innerHTML=s+'<text x="15" y="20">I (A)</text><text x="540" y="294">V (V)</text>';$("dor").textContent="VT = "+(1000*vt).toFixed(2)+" mV · I = "+(1e6*z).toPrecision(4)+" μA · "+L("Tăng điện áp mỗi bậc (xấp xỉ)","Approx. decade voltage")+" = "+(1000*n*vt*Math.log(10)).toFixed(2)+" mV"}function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(x=>x.textContent=I[x.dataset.i][lang==="vi"?0:1]);for(let k of ["vi","en"]){$(k).className="btn "+(lang===k?"btn-primary":"btn-ghost");$(k).setAttribute("aria-pressed",String(lang===k))}divider();hall();diode()}for(let k of ["vi","en"])$(k).onclick=()=>{lang=k;try{localStorage.setItem("vt-physics-lang",k)}catch{}render()};for(let k of ["r1","r2","rl","load"])$(k).oninput=divider;for(let k of ["b","n","i"])$(k).oninput=hall;for(let k of ["temp","nd","v"])$(k).oninput=diode;render();</script></body></html>
