const $=x=>document.getElementById(x),I={title:["Phòng mô phỏng Nhiệt học, AC và lượng tử","Thermal, AC and quantum lab"],author:["TS. Đặng Minh Tuấn","Dr. Dang Minh Tuan"],carnot:["Động cơ nhiệt và giới hạn Carnot","Heat engine and Carnot bound"],cintro:["Nguồn nóng cung cấp 1000 J mỗi chu trình. Đặt hiệu suất động cơ bằng một phần giới hạn Carnot; giả thiết chỉ hai nguồn nhiệt và trạng thái lặp lại.","Hot reservoir supplies 1000 J per cycle. Set efficiency to a fraction of Carnot limit; assume two reservoirs and cyclic operation."],fraction:["Tỉ lệ so với hiệu suất Carnot","Fraction of Carnot efficiency"],ctask:["Dự đoán hiệu suất nếu giữ nguồn nóng và tăng nhiệt độ nguồn lạnh. So sánh entropy tổng của hai nguồn khi hiệu suất bằng và thấp hơn Carnot.","Predict efficiency as cold temperature increases at fixed hot temperature. Compare total reservoir entropy at and below Carnot efficiency."],rlc:["Cộng hưởng RLC nối tiếp","Series RLC resonance"],rintro:["Nguồn sin 5 V RMS; R, L, C lý tưởng. Biểu đồ dòng chuẩn hóa theo Imax=V/R. Tần số quét 5–250 Hz; đồ thị dùng tần số tuyến tính.","5 V RMS sinusoidal supply; ideal R,L,C. Plot normalized current using Imax=V/R. Frequency sweep 5–250 Hz; linear frequency axis."],rtask:["Tăng R với L,C cố định. Giải thích độ rộng cộng hưởng thay đổi thế nào, và vì sao đỉnh chuẩn hóa vẫn là 1 nhưng dòng thực tại đỉnh giảm.","Raise R at fixed L,C. Explain changing resonance bandwidth and why normalized peak stays 1 while actual peak current falls."],well:["Giếng thế vô hạn một chiều","One-dimensional infinite potential well"],qintro:["Electron trong giếng vô hạn, 0<x<L. Đồ thị dùng tọa độ x/L, hàm sóng √L ψ và mật độ L|ψ|² để so sánh giữa các L. Vạch năng lượng n=1…5 có tỉ lệ theo n².","Electron in infinite well 0<x<L. Plot dimensionless x/L, wavefunction √L ψ and density L|ψ|² to compare widths. Five energy levels scale as n²."],qtask:["Dự đoán số nút bên trong giếng ở mức n=3. Sau đó tăng L gấp đôi; so sánh năng lượng, mật độ chuẩn hóa và xác suất nằm bên trái x.","Predict interior nodes at n=3. Then double L; compare energy, scaled density and probability to the left of x."],limits:["Mô hình 2D giải tích phục vụ học tập; không thay thế thiết kế nhiệt, điện công suất hoặc mô phỏng linh kiện lượng tử thực.","Analytical 2D learning models; not substitutes for thermal/power engineering or real quantum-device simulation."]};
let lang=new URLSearchParams(location.search).get("lang");if(!["vi","en"].includes(lang)){try{lang=localStorage.getItem("vt-physics-lang")}catch{}if(!["vi","en"].includes(lang))lang="vi"}const L=(a,b)=>lang==="vi"?a:b;function val(id,out,d=0){let v=+$(id).value;$(out).textContent=v.toFixed(d);return v}
function carnot(){let h=val("th","tho"),c=val("tc","tco"),frac=val("fraction","fro",2),etaC=1-c/h,eta=frac*etaC,w=1000*eta,q=1000-w,ds=q/c-1000/h;$("cg").innerHTML='<rect x="150" y="15" width="300" height="48" fill="#cdb086" stroke="#94734b"/><text x="300" y="44" text-anchor="middle">Th = '+h+' K</text><rect x="150" y="217" width="300" height="48" fill="#96b7c5" stroke="#547f9d"/><text x="300" y="247" text-anchor="middle">Tc = '+c+' K</text><circle cx="300" cy="140" r="32" fill="#d7e4df" stroke="#397c79" stroke-width="2"/><text x="300" y="145" text-anchor="middle">'+L("Máy","Engine")+'</text><path d="M300 63V102" stroke="#b68742" stroke-width="12"/><path d="M300 108 l-10 -14 h20 Z" fill="#b68742"/><text x="320" y="88">Qh = 1000 J</text><path d="M300 173V209" stroke="#547f9d" stroke-width="'+(4+8*q/1000)+'"/><path d="M300 217 l-9 -13 h18 Z" fill="#547f9d"/><text x="320" y="198">Qc = '+q.toFixed(1)+' J</text>'+(w>0?'<path d="M332 140H490" stroke="#397c79" stroke-width="'+(2+10*w/1000)+'"/><path d="M505 140 l-15 -8 v16 Z" fill="#397c79"/>':'')+'<text x="420" y="123" text-anchor="middle">W = '+w.toFixed(1)+' J</text>';$("cr").textContent="ηCarnot = "+(100*etaC).toFixed(2)+"% · η = "+(100*eta).toFixed(2)+"% · ΔS = "+Math.max(0,ds).toFixed(5)+" J/K"}
function rlc(){let R=val("r","ro"),l=val("l","lo")*.001,c=val("c","co")*1e-6,f=val("f","fo"),f0=1/(2*Math.PI*Math.sqrt(l*c)),w=2*Math.PI*f,x=w*l-1/(w*c),ratio=g=>{let z=2*Math.PI*g;return R/Math.hypot(R,z*l-1/(z*c))},X=g=>55+(g-5)/245*520,Y=v=>245-205*v;let s='<path d="M55 40V245H575" fill="none" stroke="#34595c" stroke-width="2"/>';for(let j=0;j<=4;j++){let y=Y(j*.25);s+='<line x1="55" x2="575" y1="'+y+'" y2="'+y+'" stroke="#c6d7d4"/><text x="45" y="'+(y+4)+'" text-anchor="end">'+(j*.25).toFixed(2)+'</text>'}for(let g of [5,50,100,150,200,250])s+='<text x="'+X(g)+'" y="266" text-anchor="middle">'+g+'</text>';let pts=Array.from({length:491},(_,i)=>5+i*.5);s+='<polyline points="'+pts.map(g=>X(g)+','+Y(ratio(g))).join(' ')+'" fill="none" stroke="#397c79" stroke-width="3"/><circle cx="'+X(f)+'" cy="'+Y(ratio(f))+'" r="5" fill="#b68742"/>';if(f0>=5&&f0<=250)s+='<line x1="'+X(f0)+'" x2="'+X(f0)+'" y1="40" y2="245" stroke="#547f9d" stroke-dasharray="4 3"/>';s+='<text x="12" y="21">I/Imax</text><text x="540" y="288">f (Hz)</text>';$("rg").innerHTML=s;$("rr").textContent="f₀ = "+f0.toFixed(2)+" Hz · I = "+(5/Math.hypot(R,x)).toFixed(4)+" A · P = "+(25*R/(R*R+x*x)).toFixed(4)+" W · Δf = "+(R/(2*Math.PI*l)).toFixed(2)+" Hz"}
function well(){let width=val("width","wo",1),n=val("state","so"),s0=val("x","xo",2),E1=.0381*Math.PI*Math.PI/(width*width),psi=x=>Math.SQRT2*Math.sin(n*Math.PI*x),rho=x=>psi(x)**2,X=x=>50+350*x,Yp=y=>100-37*y,Yr=y=>263-58*y;let s='<path d="M50 25V155 M400 25V155 M50 100H400 M50 185V263H400" fill="none" stroke="#34595c" stroke-width="1.7"/><text x="50" y="18">√L ψ</text><text x="50" y="177">L|ψ|²</text><text x="440" y="22">E (eV)</text>';let pts=Array.from({length:251},(_,i)=>i/250);s+='<polyline points="'+pts.map(t=>X(t)+','+Yp(psi(t))).join(' ')+'" fill="none" stroke="#397c79" stroke-width="2.5"/><polygon points="50,263 '+pts.filter(t=>t<s0).concat([s0]).map(t=>X(t)+','+Yr(rho(t))).join(' ')+' '+X(s0)+',263" fill="#b68742" opacity=".25"/><polyline points="'+pts.map(t=>X(t)+','+Yr(rho(t))).join(' ')+'" fill="none" stroke="#b68742" stroke-width="2.5"/><line x1="'+X(s0)+'" x2="'+X(s0)+'" y1="25" y2="263" stroke="#34595c" stroke-dasharray="4 3"/>';for(let j=1;j<=5;j++){let y=263-220*j*j/25;s+='<line x1="440" x2="490" y1="'+y+'" y2="'+y+'" stroke="'+(j===n?"#b68742":"#547f9d")+'" stroke-width="'+(j===n?4:1.5)+'"/><text x="498" y="'+(y+4)+'" font-size="12">'+(E1*j*j).toFixed(2)+'</text>'}for(let t of [0,.25,.5,.75,1])s+='<text x="'+X(t)+'" y="281" text-anchor="middle">'+t+'</text>';s+='<text x="365" y="308">x/L</text>';$("qg").innerHTML=s;let prob=s0-Math.sin(2*n*Math.PI*s0)/(2*n*Math.PI);$("qr").textContent="Eₙ = "+(E1*n*n).toFixed(4)+" eV · "+L("Nút bên trong","Interior nodes")+" = "+(n-1)+" · P(0≤X≤x) = "+(100*prob).toFixed(3)+"%"}
function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(x=>x.textContent=I[x.dataset.i][lang==="vi"?0:1]);for(let k of ["vi","en"]){$(k).className="btn "+(k===lang?"btn-primary":"btn-ghost");$(k).setAttribute("aria-pressed",String(k===lang))}carnot();rlc();well()}for(let k of ["vi","en"])$(k).onclick=()=>{lang=k;try{localStorage.setItem("vt-physics-lang",k)}catch{}render()};for(let k of ["th","tc","fraction"])$(k).oninput=carnot;for(let k of ["r","l","c","f"])$(k).oninput=rlc;for(let k of ["width","state","x"])$(k).oninput=well;render();</script></body></html>
