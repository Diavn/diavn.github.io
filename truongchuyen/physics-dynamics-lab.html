<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamics and circuits lab | V-TALENT 2045</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.panel{margin:18px 0}svg{width:100%;max-width:760px;height:auto;background:#f0f5f5;border-radius:8px}label{display:block;margin:8px 0}output{font-weight:bold}button{cursor:pointer}</style></head><body class="physics-page"><main><section class="hero"><div class="wrap"><div class="eyebrow">V-TALENT 2045 · PHY201-B</div><div class="controls"><button id="vi" class="btn btn-primary">Tiếng Việt</button><button id="en" class="btn btn-ghost">English</button><a class="btn btn-ghost" href="./physics-curriculum.html">Curriculum / Chương trình</a><a class="btn btn-ghost" href="./physics-textbooks.html#PHY201-B">Textbook / Giáo trình</a></div><h1 data-i="title"></h1><p data-i="intro"></p></div></section><section class="section"><div class="wrap"><article class="panel"><small>SIM-D01 · RC</small><h2 data-i="rc"></h2><p data-i="rcmodel"></p><label>R (kΩ) <input type="range" id="r" min="1" max="10" step=".5" value="2"><output id="ro"></output></label><label>C (µF) <input type="range" id="c" min="100" max="1000" step="100" value="1000"><output id="co"></output></label><svg id="rcgraph" viewBox="0 0 660 320" role="img" aria-label="RC charging and discharging voltage"></svg><p id="rcout" role="status"></p><p data-i="rctask"></p></article><article class="panel"><small>SIM-D02 · Damping</small><h2 data-i="damp"></h2><p data-i="dmodel"></p><label>ζ = γ/ω₀ <input type="range" id="z" min="0" max="2" step=".05" value=".3"><output id="zo"></output></label><svg id="dgraph" viewBox="0 0 660 320" role="img" aria-label="Free damped oscillator response"></svg><p id="dout" role="status"></p><p data-i="dtask"></p></article><article class="panel"><small>SIM-D03 · Resonance</small><h2 data-i="res"></h2><p data-i="rmodel"></p><label>ζ <input type="range" id="rz" min=".05" max="1.5" step=".05" value=".2"><output id="rzo"></output></label><label>ω/ω₀ <input type="range" id="freq" min="0" max="3" step=".01" value="1"><output id="fo"></output></label><svg id="resgraph" viewBox="0 0 660 320" role="img" aria-label="Normalized frequency response and selected frequency"></svg><p id="resout" role="status"></p><p data-i="restask"></p></article><p data-i="limit"></p></div></section></main><script>
const $=x=>document.getElementById(x),I={title:["Dynamics and circuits lab","Phòng mô phỏng động lực và mạch điện"],intro:["Predict before changing a variable. Compare analytic and graphical results.","Dự đoán trước khi thay biến. Đối chiếu kết quả giải tích và đồ thị."],rc:["RC charging and discharge","Nạp và phóng tụ RC"],rcmodel:["Ideal source 6 V; charge from 0 V or discharge from 6 V. Green: charging; orange: discharge. The time axis stays at 0–25 s.","Nguồn lý tưởng 6 V; nạp từ 0 V hoặc phóng từ 6 V. Xanh: nạp; cam: phóng. Trục thời gian cố định 0–25 s."],rctask:["Double R at fixed C. Predict the time to 63.2% of final voltage and explain why the charge curve slows.","Tăng R gấp đôi, giữ C. Dự đoán thời điểm đạt 63,2% điện áp cuối và giải thích vì sao nạp chậm hơn."],damp:["Free oscillation: three damping regimes","Dao động tự do: ba chế độ cản"],dmodel:["Normalized oscillator x(0)=1, x′(0)=0, ω₀=1 rad/s; plot x versus normalized time ω₀t.","Dao động chuẩn hóa x(0)=1, x′(0)=0, ω₀=1 rad/s; vẽ x theo thời gian chuẩn hóa ω₀t."],dtask:["Compare ζ=0, 0.3, 1 and 1.5. Identify oscillations and settling; discuss what damping optimizes in a sensor.","So sánh ζ=0; 0,3; 1; 1,5. Nhận diện dao động và xác lập; thảo luận tiêu chí tối ưu cản của cảm biến."],res:["Forced oscillation and resonance","Dao động cưỡng bức và cộng hưởng"],rmodel:["Steady-state displacement gain relative to static deflection F₀/k. Positive damping only; phase lag is in degrees.","Độ lợi li độ xác lập so với độ lệch tĩnh F₀/k. Chỉ xét cản dương; pha trễ tính theo độ."],restask:["Compare ζ=0.1 and 0.8. Check whether a nonzero resonance peak exists. Explain why displacement and velocity resonance differ.","So sánh ζ=0,1 và 0,8. Kiểm tra có đỉnh cộng hưởng khác 0 không. Giải thích vì sao cộng hưởng li độ và vận tốc khác nhau."],limit:["Analytic ideal models, no hardware or structural safety validation. Use low-voltage supervised experiments only.","Mô hình giải tích lý tưởng, không kiểm định an toàn phần cứng hoặc kết cấu. Chỉ thực nghiệm điện áp thấp có giám sát."]};let lang=new URLSearchParams(location.search).get("lang");if(!["vi","en"].includes(lang)){try{lang=localStorage.getItem("vt-physics-lang")}catch{}if(!["vi","en"].includes(lang))lang="vi"}const tr=k=>I[k][lang==="en"?0:1],L=(a,b)=>lang==="en"?a:b;
function graph(id,xmax,ymin,ymax,curves,xlabel,ylabel,point){const X=x=>55+565*x/xmax,Y=y=>270-240*(y-ymin)/(ymax-ymin);let s='<defs><clipPath id="clip-'+id+'"><rect x="55" y="30" width="565" height="240"/></clipPath></defs>';const line=(a,b,c,d,col,w=1)=>'<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="'+col+'" stroke-width="'+w+'"/>';for(let i=0;i<=5;i++){let x=xmax*i/5,y=ymin+(ymax-ymin)*i/5;s+=line(X(x),30,X(x),270,"#d3dfe0")+line(55,Y(y),620,Y(y),"#d3dfe0")+'<text x="'+X(x)+'" y="290" text-anchor="middle" fill="#34595c" font-size="12">'+Number(x.toFixed(2))+'</text><text x="46" y="'+(Y(y)+4)+'" text-anchor="end" fill="#34595c" font-size="12">'+Number(y.toFixed(2))+'</text>'}s+=line(55,270,620,270,"#34595c",2)+line(55,30,55,270,"#34595c",2)+'<text x="620" y="312" text-anchor="end" fill="#34595c">'+xlabel+'</text><text x="12" y="20" fill="#34595c">'+ylabel+'</text><g clip-path="url(#clip-'+id+')">';for(const c of curves)s+='<polyline fill="none" stroke="'+c.color+'" stroke-width="3" points="'+Array.from({length:601},(_,i)=>{let x=xmax*i/600;return X(x)+","+Y(c.f(x))}).join(" ")+'"/>';if(point)s+='<circle cx="'+X(point[0])+'" cy="'+Y(point[1])+'" r="5" fill="#b57a28"/>';$(id).innerHTML=s+'</g>'}
function rc(){let r=+$("r").value,c=+$("c").value,tau=r*c/1000,up=t=>6*(-Math.expm1(-t/tau)),down=t=>6*Math.exp(-t/tau);$("ro").textContent=r;$("co").textContent=c;graph("rcgraph",25,0,6.3,[{f:up,color:"#16756f"},{f:down,color:"#b57a28"}],"t (s)","U (V)",[tau,up(tau)]);$("rcout").textContent="τ = "+tau.toFixed(3)+" s · U(τ) = "+up(tau).toFixed(3)+" V · "+L("half discharge time","thời gian phóng còn nửa")+" = "+(tau*Math.log(2)).toFixed(3)+" s"}
function response(z,t){if(Math.abs(z-1)<1e-10)return (1+t)*Math.exp(-t);if(z<1){let w=Math.sqrt(1-z*z);return Math.exp(-z*t)*(Math.cos(w*t)+z*Math.sin(w*t)/w)}let a=Math.sqrt(z*z-1),r1=-z+a,r2=-z-a;return (-r2*Math.exp(r1*t)+r1*Math.exp(r2*t))/(r1-r2)}
function damp(){let z=+$("z").value;$("zo").textContent=z.toFixed(2);graph("dgraph",20,-1.1,1.1,[{f:t=>response(z,t),color:"#16756f"}],"ω₀t","x/x₀");$("dout").textContent=z===0?L("Undamped","Không cản"):z<1?L("Underdamped","Dưới tới hạn"):z===1?L("Critically damped","Cản tới hạn"):L("Overdamped","Quá tắt dần")}
function resonance(){let z=+$("rz").value,f=+$("freq").value,g=w=>1/Math.hypot(1-w*w,2*z*w),peak=z<Math.SQRT1_2?Math.sqrt(1-2*z*z):0,phase=Math.atan2(2*z*f,1-f*f)*180/Math.PI;$("rzo").textContent=z.toFixed(2);$("fo").textContent=f.toFixed(2);graph("resgraph",3,0,Math.max(2,g(peak)*1.1),[{f:g,color:"#16756f"}],"ω/ω₀","A/(F₀/k)",[f,g(f)]);$("resout").textContent=L("Gain","Độ lợi")+" = "+g(f).toFixed(3)+" · "+L("Phase lag","Pha trễ")+" = "+phase.toFixed(1)+"° · "+L("Peak frequency ratio","Tỉ số tần số tại đỉnh")+" = "+peak.toFixed(3)}
function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(x=>x.textContent=tr(x.dataset.i));for(const k of ["vi","en"]){$(k).className="btn "+(lang===k?"btn-primary":"btn-ghost");$(k).setAttribute("aria-pressed",String(lang===k))}rc();damp();resonance()}for(const k of ["vi","en"])$(k).onclick=()=>{lang=k;try{localStorage.setItem("vt-physics-lang",k)}catch{}render()};for(const k of ["r","c"])$(k).oninput=rc;$("z").oninput=damp;for(const k of ["rz","freq"])$(k).oninput=resonance;render();
</script></body></html>
