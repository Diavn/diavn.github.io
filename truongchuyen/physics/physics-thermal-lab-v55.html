<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.5 Thermal Physics Lab</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>main{max-width:1080px;margin:auto;padding:1rem}section{border:1px solid #c9d7d4;border-radius:8px;padding:1rem;margin:1rem 0}svg{width:100%;max-width:550px;height:auto;background:#fff}label{display:block;margin:.6rem 0}input[type=range]{width:min(100%,420px)}output{font-weight:bold}p{line-height:1.6}.result{font-size:1.05rem;background:#eaf1ef;color:#193c46;padding:.8rem}button{margin:.4rem}</style></head><body><main><h1>V5.5 · Fluids & Thermal Physics Laboratory</h1><p><a href="../physics.html">Physics home</a> · <a href="./physics-volume04-v63.html">Volume 04</a> · <a href="./physics-thermal-level2-v55.html">Lessons</a></p><p>TS. Đặng Minh Tuấn / Dr. Dang Minh Tuan. Các mô hình lý tưởng để dự đoán và kiểm định, không dùng làm thông số thiết kế thiết bị thực. / Idealized learning models, not engineering specifications.</p><div id="labs"></div></main><script>
const defs=[
{id:"venturi",title:"Venturi · Ống thu hẹp",note:"Steady incompressible inviscid horizontal flow; water density 1000 kg/m³. Predict pressure change before adjusting area.",fields:[["a","A₁/A₂",1,5,.1,2],["v","v₁ (m/s)",.1,2,.1,1]],calc:({a,v})=>{let v2=a*v,dp=500*(v2*v2-v*v);return {result:"v₂ = "+v2.toFixed(2)+" m/s · Δp = "+dp.toFixed(1)+" Pa",svg:'<path d="M20 48 H130 L190 '+(100-48/a)+' H270 L330 48 H400 M20 152 H130 L190 '+(100+48/a)+' H270 L330 152 H400" stroke="#244d55" stroke-width="3" fill="none"/><path d="M35 100 H110 M200 100 H'+(200+Math.min(65,16*v2))+' M335 100 H390" stroke="#247b73" stroke-width="4"/><text x="68" y="35">A₁</text><text x="220" y="35">A₂</text><text x="210" y="180" text-anchor="middle">Q = Av</text>'}}},
{id:"poiseuille",title:"Poiseuille · Dòng tầng",note:"Water-like Newtonian fluid, fully developed pipe flow; L=0.1 m, η=0.001 Pa·s, ρ=1000 kg/m³. Check Reynolds number before using model.",fields:[["r","R (mm)",.1,1,.1,.5],["p","Δp (Pa)",10,300,10,100]],calc:({r,p})=>{let R=r/1000,Q=Math.PI*R**4*p/(8*.001*.1),v=Q/(Math.PI*R*R),Re=1000*v*2*R/.001;let lines=Array.from({length:9},(_,i)=>{let x=(i-4)/4,y=40+i*15;return '<path d="M40 '+y+' H'+(40+290*(1-x*x))+'" stroke="#247b73" stroke-width="3"/>'}).join("");return {result:"Q = "+(Q*1e9).toFixed(2)+" µL/s · mean v = "+v.toFixed(4)+" m/s · Re = "+Re.toFixed(1),svg:'<path d="M20 40 H400 M20 160 H400" stroke="#244d55" stroke-width="2"/>'+lines+'<text x="210" y="185" text-anchor="middle">Parabolic profile · normalized</text>'}}},
{id:"maxwell",title:"Maxwell–Boltzmann · Phân bố tốc độ",note:"Classical ideal gas at equilibrium, M=0.032 kg/mol. Both curves use the same speed and probability-density scales; area under each full curve is 1.",fields:[["t","T (K)",150,900,25,300]],calc:({t})=>{let R=8.314,M=.032,mp=Math.sqrt(2*R*t/M),rms=Math.sqrt(3*R*t/M);const f=(v,T)=>4*Math.PI*(M/(2*Math.PI*R*T))**1.5*v*v*Math.exp(-M*v*v/(2*R*T));const path=T=>Array.from({length:151},(_,i)=>{let v=i*12;return (i?"L":"M")+(40+v/1800*350)+" "+(170-f(v,T)/.0035*145)}).join(" ");return {result:"vₚ = "+mp.toFixed(1)+" m/s · vᵣₘₛ = "+rms.toFixed(1)+" m/s",svg:'<path d="M40 18 V170 H400" stroke="#244d55" fill="none"/><path d="'+path(300)+'" stroke="#a3642c" stroke-width="2" fill="none"/><path d="'+path(t)+'" stroke="#247b73" stroke-width="3" fill="none"/><text x="45" y="15">f(v)</text><text x="395" y="188" text-anchor="end">1800 m/s</text><text x="280" y="30" fill="#a3642c">300 K</text><text x="280" y="49" fill="#247b73">'+t+' K</text>'}}},
{id:"carnot",title:"Carnot · Chu trình thuận nghịch T–S",note:"Th > Tc, reversible cycle, ΔS=2 J/K. Rectangle area is net work. Change reservoir temperatures and compare efficiency.",fields:[["h","Th (K)",400,800,20,500],["c","Tc (K)",200,380,20,300]],calc:({h,c})=>{let yt=170-h/800*145,yb=170-c/800*145;return {result:"Qin = "+2*h+" J · Qout = "+2*c+" J · W = "+2*(h-c)+" J · η = "+(100*(1-c/h)).toFixed(1)+"%",svg:'<path d="M40 18 V170 H400" stroke="#244d55" fill="none"/><rect x="100" y="'+yt+'" width="200" height="'+(yb-yt)+'" fill="#d9e9e7" stroke="#247b73" stroke-width="2"/><path d="M155 '+yt+' H245 l-8 -5 m8 5 l-8 5 M245 '+yb+' H155 l8 -5 m-8 5 l8 5" stroke="#a3642c" fill="none" stroke-width="2"/><text x="305" y="'+(yt+4)+'">Th</text><text x="305" y="'+(yb+4)+'">Tc</text><text x="400" y="185">S</text><text x="22" y="18">T</text>'}}},
{id:"chip",title:"Thermal resistance · Làm mát chip",note:"Steady lumped model; ambient 25°C, series thermal resistances R₁ and R₂. Synthetic teaching values, not a real chip rating.",fields:[["p","P (W)",5,40,1,20],["r1","R₁ (K/W)",.1,2,.1,.5],["r2","R₂ (K/W)",.1,3,.1,1.5]],calc:({p,r1,r2})=>{let t=25+p*(r1+r2),mid=25+p*r2;return {result:"Tj = "+t.toFixed(1)+" °C · intermediate = "+mid.toFixed(1)+" °C · "+(t<=85?"below":"above")+" illustrative 85°C limit",svg:'<rect x="25" y="60" width="85" height="80" fill="#f3d7b9" stroke="#244d55"/><rect x="150" y="60" width="85" height="80" fill="#d9e9e7" stroke="#244d55"/><rect x="275" y="60" width="85" height="80" fill="#d9e9e7" stroke="#244d55"/><path d="M110 100 H150 M235 100 H275 M360 100 H400" stroke="#a3642c" stroke-width="3"/><text x="65" y="88" text-anchor="middle">Tj</text><text x="65" y="110" text-anchor="middle">'+t.toFixed(1)+'°C</text><text x="192" y="105" text-anchor="middle">R₁</text><text x="317" y="105" text-anchor="middle">R₂</text><text x="378" y="82">Ta</text>'}}}
];
for(const d of defs){let sec=document.createElement("section");sec.id=d.id;sec.innerHTML='<h2>'+d.title+'</h2><p>'+d.note+'</p><svg viewBox="0 0 420 200" role="img" aria-label="'+d.title+'"></svg>'+d.fields.map(([k,l,min,max,step,value])=>'<label>'+l+' <output id="'+d.id+'-'+k+'-out">'+value+'</output><br><input type="range" data-k="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"></label>').join("")+'<p class="result" aria-live="polite"></p><p>Dự đoán trước khi đổi tham số; ghi kết quả và giải thích giới hạn mô hình. / Predict, test, explain the model limits.</p>';document.getElementById("labs").append(sec);function render(){let vals={};for(const x of sec.querySelectorAll("input")){vals[x.dataset.k]=Number(x.value);sec.querySelector("#"+d.id+"-"+x.dataset.k+"-out").value=x.value}const o=d.calc(vals);sec.querySelector("svg").innerHTML='<rect width="420" height="200" fill="white"/><g font-family="sans-serif" font-size="13" fill="#193c46">'+o.svg+'</g>';sec.querySelector(".result").textContent=o.result}for(const x of sec.querySelectorAll("input"))x.addEventListener("input",render);render()}
</script></body></html>
