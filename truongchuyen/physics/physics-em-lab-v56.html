<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.6 EM Lab</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>main{max-width:980px;margin:auto;padding:1rem}section{border:1px solid #cbd7d6;border-radius:8px;padding:1rem;margin:1rem 0}svg{width:100%;max-width:550px;height:auto;background:white}label{display:block;margin:.6rem 0}input[type=range]{width:min(100%,420px)}output{font-weight:bold}.result{padding:.8rem;background:#eaf1ef;color:#193c46}p{line-height:1.65}</style></head><body><main><h1>V5.6 · Electricity &amp; Electromagnetism Laboratory</h1><p><a href="../physics.html">Physics</a> · <a href="./physics-volume05-v63.html">V05</a> · <a href="./physics-volume06-v63.html">V06</a></p><p>TS. Đặng Minh Tuấn / Dr. Dang Minh Tuan. Dự đoán trước, thay đổi tham số, giải thích kết quả và giới hạn mô hình. / Predict, vary, explain and test model limits. Idealized teaching models.</p><div id="labs"></div></main><script>
const axes=(x,y)=>'<path d="M40 20 V165 H390" stroke="#244d55" fill="none" stroke-width="2"/><text x="390" y="185" text-anchor="end">'+x+'</text><text x="30" y="17" text-anchor="end">'+y+'</text>';
const path=(fn,a,b,m)=>Array.from({length:101},(_,i)=>(i?'L':'M')+(40+350*i/100)+' '+(165-130*fn(a+(b-a)*i/100)/m)).join(' ');
const graph=(d,c='#247b73')=>'<path d="'+d+'" stroke="'+c+'" stroke-width="2.5" fill="none"/>';
const defs=[
{id:'load',title:'Nguồn thực / Real source',note:'E=12 V, r=2 Ω. Find the resistance for maximum load power and compare efficiency.',fields:[['r','R (Ω)',.5,12,.5,4]],calc:({r})=>{let I=12/(2+r),P=I*I*r;return {result:'I = '+I.toFixed(3)+' A · P = '+P.toFixed(2)+' W · η = '+(100*r/(r+2)).toFixed(1)+'%',svg:axes('R (Ω)','P (W)')+graph(path(x=>144*x/(x+2)**2,0,12,20))+'<circle cx="'+(40+350*r/12)+'" cy="'+(165-130*P/20)+'" r="5" fill="#a3642c"/><text x="98" y="28">Maximum at R = r</text>'}}},
{id:'bridge',title:'Mạch cầu / Bridge',note:'Va=10 V,Vb=0; R1=R2=R3=R5=1 Ω. Adjust R4 and infer current direction through R5.',fields:[['r','R₄ (Ω)',.5,5,.1,2]],calc:({r})=>{let a=2+1/r,vc=(10*a+10)/(3*a-1),vd=3*vc-10,i=vc-vd;return {result:'Vc = '+vc.toFixed(3)+' V · Vd = '+vd.toFixed(3)+' V · I(c→d) = '+i.toFixed(3)+' A',svg:'<path d="M45 100 L210 30 L375 100 L210 170 Z M210 30 V170" stroke="#244d55" fill="none" stroke-width="2"/>'+[[45,100,'a'],[375,100,'b'],[210,30,'c'],[210,170,'d']].map(([x,y,t])=>'<circle cx="'+x+'" cy="'+y+'" r="4" fill="#244d55"/><text x="'+(x+12)+'" y="'+(y-7)+'">'+t+'</text>').join('')+'<text x="110" y="50">R1</text><text x="300" y="50">R2</text><text x="105" y="150">R3</text><text x="295" y="150">R4</text><text x="220" y="105">R5</text>'}}},
{id:'rc',title:'RC quá độ / RC charging',note:'Initially empty capacitor, ideal 6 V supply. Plot against physical time 0–5 s.',fields:[['r','R (kΩ)',.5,4,.5,2],['c','C (µF)',100,1000,100,500],['t','t (s)',0,5,.1,1]],calc:({r,c,t})=>{let tau=r*c/1000,V=6*(1-Math.exp(-t/tau));return {result:'τ = '+tau.toFixed(3)+' s · Vc = '+V.toFixed(3)+' V · I = '+(6/r*Math.exp(-t/tau)).toFixed(3)+' mA',svg:axes('t (s)','Vc (V)')+graph(path(x=>6*(1-Math.exp(-x/tau)),0,5,6))+'<circle cx="'+(40+350*t/5)+'" cy="'+(165-130*V/6)+'" r="5" fill="#a3642c"/>'}}},
{id:'lorentz',title:'Quỹ đạo Lorentz / Lorentz trajectory',note:'Positive particle, B into page, m/q=2×10⁻⁷ kg/C, nonrelativistic perpendicular motion. Fixed spatial scale.',fields:[['b','B (T)',.2,1,.1,.5],['v','v (km/s)',2,12,1,10]],calc:({b,v})=>{let rad=2e-7*v*1000/b,T=2*Math.PI*2e-7/b,px=rad*6500;return {result:'r = '+(rad*1000).toFixed(2)+' mm · T = '+(T*1e6).toFixed(3)+' µs',svg:Array.from({length:15},(_,i)=>'<text x="'+(35+(i%5)*82)+'" y="'+(35+Math.floor(i/5)*65)+'">×</text>').join('')+'<circle cx="210" cy="100" r="'+px+'" fill="none" stroke="#247b73" stroke-width="2"/><circle cx="'+(210+px)+'" cy="100" r="5" fill="#a3642c"/><path d="M'+(210+px)+' 100 v-35 l-5 8 m5 -8 l5 8" stroke="#a3642c" stroke-width="2" fill="none"/><text x="210" y="190" text-anchor="middle">q &gt; 0 · B inward</text>'}}},
{id:'rlc',title:'RLC cộng hưởng / RLC resonance',note:'Series RLC, R=5 Ω,L=0.1 H,C=100 µF; source 10 V RMS. Observe peak current and phase.',fields:[['w','ω (rad/s)',100,700,5,315]],calc:({w})=>{let x=.1*w-1/(w*.0001),I=10/Math.hypot(5,x),phi=Math.atan2(x,5)*180/Math.PI;return {result:'I = '+I.toFixed(3)+' A RMS · φ = '+phi.toFixed(2)+'° · P = '+(I*I*5).toFixed(2)+' W',svg:axes('ω (rad/s)','I (A)')+graph(path(z=>10/Math.hypot(5,.1*z-1/(z*.0001)),100,700,2))+ '<circle cx="'+(40+350*(w-100)/600)+'" cy="'+(165-65*I)+'" r="5" fill="#a3642c"/>'}}}
];
for(const d of defs){let sec=document.createElement('section');sec.id=d.id;sec.innerHTML='<h2>'+d.title+'</h2><p>'+d.note+'</p><svg viewBox="0 0 420 200" role="img" aria-label="'+d.title+'"></svg>'+d.fields.map(([k,l,min,max,step,value])=>'<label>'+l+' <output data-out="'+k+'">'+value+'</output><br><input data-k="'+k+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"></label>').join('')+'<p class="result" aria-live="polite"></p>';document.getElementById('labs').append(sec);function render(){let vals={};for(const x of sec.querySelectorAll('input')){vals[x.dataset.k]=Number(x.value);sec.querySelector('[data-out="'+x.dataset.k+'"]').value=x.value}let o=d.calc(vals);sec.querySelector('svg').innerHTML='<rect width="420" height="200" fill="white"/><g font-family="sans-serif" font-size="12" fill="#193c46">'+o.svg+'</g>';sec.querySelector('.result').textContent=o.result}for(const x of sec.querySelectorAll('input'))x.addEventListener('input',render);render()}
</script></body></html>
