<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computational physics lab | V-TALENT 2045</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./physics-style.css"><style>.panel{margin:20px 0}.toolbar{display:flex;flex-wrap:wrap;gap:12px}label{display:block;margin:10px 0}svg{max-width:720px;width:100%;height:auto;background:#f1f5f4}output{font-weight:bold}table{width:100%}td,th{text-align:left;padding:6px}</style></head><body class="physics-page"><main><section class="hero"><div class="wrap"><div class="eyebrow">V-TALENT 2045 · COMPUTATIONAL PHYSICS</div><h1 data-i="title"></h1><div class="toolbar"><button id="vi" class="btn btn-primary">Tiếng Việt</button><button id="en" class="btn btn-ghost">English</button><a href="./physics-foundations-olympiad-research.html?module=PHY210-A" class="btn btn-ghost">PHY210-A</a><a href="./physics-curriculum.html" class="btn btn-ghost">Curriculum</a></div><p data-i="author"></p></div></section><section class="section"><div class="wrap"><article class="panel"><small>SIM-C01 · PHY210-A</small><h2 data-i="decay"></h2><p data-i="dintro"></p><label>k (s⁻¹) <input id="k" type="range" min=".5" max="4" step=".5" value="2"> <output id="ko"></output></label><label>h (s) <input id="h" type="range" min=".05" max="1" step=".05" value=".5"> <output id="ho"></output></label><svg id="dg" viewBox="0 0 680 310" role="img" aria-label="Euler numerical decay versus analytical exponential"></svg><p id="dr" role="status"></p><p data-i="dtask"></p></article><article class="panel"><small>SIM-C02 · PHY210-A / PHY205-A</small><h2 data-i="osc"></h2><p data-i="ointro"></p><label>h (s) <input id="step" type="range" min=".025" max=".5" step=".025" value=".1"> <output id="so"></output></label><svg id="og" viewBox="0 0 680 320" role="img" aria-label="Relative oscillator energy of three numerical integrators"></svg><table><thead><tr><th>Method</th><th>E(T)/E(0)</th><th>max |E/E(0)−1|</th></tr></thead><tbody id="tab"></tbody></table><p id="orr" role="status"></p><p data-i="otask"></p></article><p data-i="limits"></p></div></section></main><script>
const $=id=>document.getElementById(id),I={title:["Phòng mô phỏng vật lý tính toán","Computational physics lab"],author:["TS. Đặng Minh Tuấn","Dr. Dang Minh Tuan"],decay:["Euler tiến: hội tụ và ổn định","Forward Euler: convergence and stability"],dintro:["x' = −kx, x(0)=1. So sánh Euler tiến với nghiệm e^(−kt) trên 5 s. Đường nối các điểm số chỉ để trực quan. Trục y dùng thang tuyến tính tự điều chỉnh.","x' = −kx, x(0)=1. Compare forward Euler with exact e^(−kt) over 5 s. Connecting numerical points is only a visual aid. Linear y-axis autoscaled."],dtask:["Tìm miền bước h làm nghiệm số đổi dấu nhưng vẫn giảm biên độ. Kiểm chứng khi kh=2. Sau đó giảm h và so sánh sai số tại cùng thời điểm cuối.","Find h where numerical values alternate sign but decay in magnitude. Test kh=2. Then reduce h and compare errors at the same final time."],osc:["Dao động không cản: kiểm tra năng lượng","Undamped oscillator: energy check"],ointro:["m=1 kg, ω=2 rad/s, x(0)=1 m, v(0)=0. So sánh Euler tiến, Euler-Cromer và velocity Verlet. Tích phân tới 10 s với bước cuối được rút ngắn nếu cần. Đồ thị năng lượng chuẩn hóa dùng trục log10.","m=1 kg, ω=2 rad/s, x(0)=1 m, v(0)=0. Compare forward Euler, Euler-Cromer and velocity Verlet. Integrate to 10 s with a shortened final step if needed. Normalized energy uses log10 scale."],otask:["Giảm bước một nửa. So sánh độ lệch năng lượng tối đa của ba thuật toán. Vì sao năng lượng tăng trong Euler tiến không phải cơ chế cấp năng lượng thật? Kiểm tra thêm sai số pha nếu cần đánh giá quỹ đạo.","Halve the step. Compare maximum energy deviations of the methods. Why is forward Euler energy growth not a real energy source? Check phase error as well when evaluating trajectories."],limits:["Mô hình giải tích và dữ liệu mô phỏng, không phải thực nghiệm. Mọi kết quả phụ thuộc điều kiện đầu, bước và thuật toán.","Analytical and synthetic models, not experiments. Results depend on initial conditions, timestep and algorithm."]};let lang=new URLSearchParams(location.search).get("lang");if(!["vi","en"].includes(lang)){try{lang=localStorage.getItem("vt-physics-lang")}catch{}if(!["vi","en"].includes(lang))lang="vi"}const L=(a,b)=>lang==="vi"?a:b;const val=(id,out,d)=>{let v=+$(id).value;$(out).textContent=v.toFixed(d);return v};
function decay(){let k=val("k","ko",1),h=val("h","ho",2),p=[{t:0,x:1}],t=0,x=1;while(t<5-1e-10){let dt=Math.min(h,5-t);x*=1-k*dt;t+=dt;p.push({t,x})}let exact=Array.from({length:251},(_,i)=>({t:i/50,x:Math.exp(-k*i/50)})),lo=Math.min(-.1,...p.map(a=>a.x)),hi=Math.max(1.1,...p.map(a=>a.x)),X=t=>60+590*t/5,Y=x=>260-220*(x-lo)/(hi-lo),line=(a,col)=>'<polyline points="'+a.map(q=>X(q.t)+','+Y(q.x)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.4"/>';let s='<path d="M60 40V260H650" fill="none" stroke="#34595c"/><line x1="60" x2="650" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#839995" stroke-dasharray="4 4"/>'+line(exact,"#397c79")+line(p,"#b68742");for(let a of p)s+='<circle cx="'+X(a.t)+'" cy="'+Y(a.x)+'" r="2.5" fill="#b68742"/>';for(let i=0;i<=5;i++)s+='<text x="'+X(i)+'" y="280" text-anchor="middle">'+i+'</text>';for(let z of [lo,hi])s+='<text x="53" y="'+(Y(z)+4)+'" text-anchor="end">'+z.toPrecision(3)+'</text>';$("dg").innerHTML=s+'<text x="12" y="20">x</text><text x="620" y="300">t (s)</text><text x="360" y="20" fill="#397c79">Exact</text><text x="450" y="20" fill="#b68742">Euler</text>';$("dr").textContent="kh = "+(k*h).toFixed(3)+" · "+(Math.abs(1-k*h)<1?L("ổn định tuyến tính","linearly stable"):Math.abs(1-k*h)===1?L("biên ổn định","stability boundary"):L("không ổn định","unstable"))+" · x(5) = "+x.toPrecision(5)+" · "+L("sai số tuyệt đối","absolute error")+" = "+Math.abs(x-Math.exp(-5*k)).toPrecision(5)}
function osc(){let h=val("step","so",3),T=10,methods=["Euler","Euler-Cromer","Velocity Verlet"],colors=["#b68742","#547f9d","#397c79"],paths=methods.map(name=>{let x=1,v=0,t=0,arr=[{t:0,e:1}];while(t<T-1e-10){let dt=Math.min(h,T-t),a=-4*x;if(name==="Euler"){x+=dt*v;v+=dt*a}else if(name==="Euler-Cromer"){v+=dt*a;x+=dt*v}else{let xn=x+v*dt+.5*a*dt*dt;v+=.5*(a-4*xn)*dt;x=xn}t+=dt;arr.push({t,e:(.5*v*v+2*x*x)/2})}return arr}),logs=paths.flatMap(a=>a.map(p=>Math.log10(p.e))),lo=Math.min(-.15,...logs),hi=Math.max(.15,...logs),X=t=>60+590*t/T,Y=e=>260-220*(Math.log10(e)-lo)/(hi-lo);let s='<path d="M60 40V260H650" stroke="#34595c" fill="none"/><line x1="60" x2="650" y1="'+Y(1)+'" y2="'+Y(1)+'" stroke="#839995" stroke-dasharray="4 4"/><text x="53" y="'+(Y(1)+4)+'" text-anchor="end">1</text>';for(let j=Math.ceil(lo);j<=Math.floor(hi);j++){if(j===0)continue;let y=Y(10**j);s+='<line x1="60" x2="650" y1="'+y+'" y2="'+y+'" stroke="#d3dfdb"/><text x="53" y="'+(y+4)+'" text-anchor="end">10^'+j+'</text>'}paths.forEach((p,i)=>s+='<polyline points="'+p.map(q=>X(q.t)+','+Y(q.e)).join(' ')+'" fill="none" stroke="'+colors[i]+'" stroke-width="2.2"/><text x="'+(100+i*185)+'" y="20" fill="'+colors[i]+'">'+methods[i]+'</text>');for(let j=0;j<=10;j+=2)s+='<text x="'+X(j)+'" y="280" text-anchor="middle">'+j+'</text>';$("og").innerHTML=s+'<text x="8" y="34">E/E0</text><text x="620" y="300">t (s)</text>';$("tab").innerHTML=paths.map((p,i)=>'<tr><td>'+methods[i]+'</td><td>'+p.at(-1).e.toPrecision(6)+'</td><td>'+Math.max(...p.map(x=>Math.abs(x.e-1))).toPrecision(6)+'</td></tr>').join('');$("orr").textContent="hω = "+(2*h).toFixed(3)+" · "+L("năng lượng giải tích giữ nguyên 2 J","analytical energy remains 2 J")}
function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(x=>x.textContent=I[x.dataset.i][lang==="vi"?0:1]);for(let k of ["vi","en"]){$(k).className="btn "+(k===lang?"btn-primary":"btn-ghost");$(k).setAttribute("aria-pressed",String(k===lang))}decay();osc()}for(let k of ["vi","en"])$(k).onclick=()=>{lang=k;try{localStorage.setItem("vt-physics-lang",k)}catch{}render()};for(let k of ["k","h"])$(k).oninput=decay;$("step").oninput=osc;render();</script></body></html>
